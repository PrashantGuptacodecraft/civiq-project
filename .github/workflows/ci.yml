name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-node:
    name: Verify Node Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm --workspace=@civiq/db exec -- prisma validate --schema=./prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/civiq_dev"

      - name: Generate Prisma Client
        run: npm --workspace=@civiq/db run db:generate

      - name: Check for security vulnerabilities
        run: npm audit --omit=dev || true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  verify-python:
    name: Verify Python Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with Ruff
        run: ruff check .

      - name: Typecheck with Mypy
        run: mypy .

      - name: Test with Pytest
        run: pytest tests
