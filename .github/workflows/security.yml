name: Security Hardening & Vulnerability Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run daily at 02:00 UTC for continuous dependency vulnerability monitoring
    - cron: '0 2 * * *'

jobs:
  secret-scan:
    name: Secret & Credential Leak Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Run NPM Production Dependency Audit
        run: npm audit --omit=dev --audit-level=high

  security-tests:
    name: Security Test Suite & RBAC Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Database Client
        run: npm --workspace=@civiq/db run db:generate

      - name: Run Security Middleware & Threat Model Test Suite
        run: npm --workspace=@civiq/backend run test -- src/middleware/security.test.js

      - name: Run RBAC Authorization & Scope Isolation Tests
        run: npm --workspace=@civiq/auth run test
