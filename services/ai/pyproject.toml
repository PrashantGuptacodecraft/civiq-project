[project]
name = "civiq-ai"
version = "0.1.0"
description = "CivIQ AI Gateway"
requires-python = ">=3.10"

dependencies = [
  "fastapi",
  "uvicorn"
]

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "pytest"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.mypy]
strict = true
